
name: Install ShiroGifts starter archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack starter files
        run: |
          test -f ShiroGifts-starter.zip
          unzip -o ShiroGifts-starter.zip -d .
          rm ShiroGifts-starter.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add ShiroGifts starter project"
            git push
          fi
          
