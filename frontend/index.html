<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ShiroGifts — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #12141a;
    --surface: #1a1d26;
    --surface-2: #222633;
    --surface-3: #2a2f3e;
    --text: #f0f2f5;
    --text-dim: #8b93a5;
    --accent: #5b8def;
    --accent-2: #4a7ae0;
    --gold: #f5c542;
    --danger: #e85d5d;
    --success: #4ade80;
    --border: #2e3444;
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
    padding-bottom: 88px;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 10px; position:sticky; top:0;
    background:linear-gradient(180deg, var(--bg) 75%, transparent);
    z-index:10;
  }
  .logo {
    font-size:22px; font-weight:800; letter-spacing:-0.8px;
    display:flex; align-items:center; gap:8px;
  }
  .logo .logo-icon {
    width:32px; height:32px; border-radius:10px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 2px 10px rgba(91,141,239,0.35);
  }
  .logo span { color:var(--accent); }
  .header-right { display:flex; align-items:center; gap:8px; }
  .online-badge {
    background:var(--surface); border:1.5px solid var(--border);
    padding:7px 12px; border-radius:20px; font-size:12px; font-weight:700;
    display:flex; align-items:center; gap:6px; color:var(--text-dim);
  }
  .online-dot {
    width:7px; height:7px; border-radius:50%; background:var(--success);
    box-shadow:0 0 8px var(--success); animation:pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .balance {
    background:var(--surface); border:1.5px solid var(--border);
    padding:8px 14px; border-radius:22px; font-size:14px; font-weight:700;
    display:flex; align-items:center; gap:6px;
  }
  .balance .star { color:var(--gold); font-size:15px; }

  .page { display:none; padding:0 18px; animation:fade .25s ease; }
  .page.active { display:block; }
  @keyframes fade { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  .section-title {
    font-size:13px; text-transform:uppercase; letter-spacing:1.4px;
    color:var(--text-dim); margin:20px 0 14px; font-weight:800;
  }

  .cases-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .case-card {
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:var(--radius); padding:18px 14px; text-align:center;
    cursor:pointer; transition:transform .18s, border-color .18s, box-shadow .18s;
    position:relative; overflow:hidden;
  }
  .case-card:active { transform:scale(.96); border-color:var(--accent); box-shadow:0 0 20px rgba(91,141,239,0.15); }
  .case-card .gift-img {
    width:70px; height:70px; margin:0 auto 10px;
    display:flex; align-items:center; justify-content:center;
    font-size:48px; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  .case-card .name { font-size:15px; font-weight:800; margin-bottom:4px; letter-spacing:-0.3px; }
  .case-card .price { font-size:14px; color:var(--accent); font-weight:800; }
  .case-card .nft-hint {
    font-size:10px; color:var(--gold); font-weight:700; margin-top:5px;
    letter-spacing:0.3px;
  }
  .case-card .rarity-bar {
    height:3px; border-radius:2px; margin-top:10px;
    background:linear-gradient(90deg, var(--success), var(--gold), var(--danger)); opacity:.7;
  }
  .case-card .badge {
    position:absolute; top:10px; right:10px;
    background:var(--success); color:#0a0c10;
    font-size:10px; font-weight:800; padding:3px 8px; border-radius:8px;
    letter-spacing:0.5px;
  }
  .case-card .badge.sub { background:var(--accent); }

  .inv-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .inv-item {
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:var(--radius); padding:16px 12px; text-align:center;
    transition:opacity .3s, transform .3s;
  }
  .inv-item.removing { opacity:0; transform:scale(.85); }
  .inv-item .gift-img { font-size:44px; display:block; margin-bottom:8px; }
  .inv-item .name { font-size:14px; font-weight:800; letter-spacing:-0.2px; }
  .inv-item .rarity { font-size:11px; color:var(--text-dim); margin:3px 0 8px; font-weight:600; }
  .inv-item .value { font-size:13px; color:var(--gold); font-weight:800; margin-bottom:12px; }
  .inv-actions { display:flex; gap:8px; }
  .btn {
    flex:1; border:none; border-radius:10px; padding:11px 0;
    font-size:12px; font-weight:800; cursor:pointer;
    transition:opacity .15s, transform .1s; letter-spacing:0.2px;
  }
  .btn:active { transform:scale(.95); }
  .btn:disabled { opacity:.35; pointer-events:none; }
  .btn-sell { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn-withdraw { background:var(--accent); color:#fff; }

  .empty-state {
    grid-column:1/-1; text-align:center; padding:50px 20px;
    color:var(--text-dim); font-size:14px;
  }
  .empty-state .big { font-size:56px; margin-bottom:14px; opacity:.4; }

  .upgrade-box {
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:var(--radius); padding:22px 18px;
  }
  .upgrade-row {
    display:flex; align-items:center; justify-content:center;
    gap:14px; margin-bottom:20px;
  }
  .upgrade-slot {
    flex:1; background:var(--surface-2); border:2px dashed var(--border);
    border-radius:16px; padding:16px 8px; min-height:120px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .upgrade-slot .gift-img { font-size:42px; }
  .upgrade-slot .label { font-size:12px; color:var(--text-dim); margin-top:8px; text-align:center; font-weight:600; }
  .upgrade-arrow { font-size:26px; color:var(--accent); font-weight:800; }

  .picker-title { font-size:12px; color:var(--text-dim); font-weight:700; margin:12px 0 6px; }
  .picker-list {
    display:flex; gap:10px; overflow-x:auto; padding:4px 2px 12px;
    scrollbar-width:none;
  }
  .picker-list::-webkit-scrollbar { display:none; }
  .picker-item {
    flex:0 0 auto; width:82px; padding:12px 8px; text-align:center;
    background:var(--surface-2); border:2px solid var(--border);
    border-radius:14px; cursor:pointer; transition:border-color .15s, transform .1s;
  }
  .picker-item:active { transform:scale(.95); }
  .picker-item.selected { border-color:var(--accent); background:var(--surface-3); }
  .picker-item .gift-img { font-size:32px; display:block; }
  .picker-item .label { font-size:10px; color:var(--text-dim); margin-top:6px; font-weight:600; }
  .picker-item .price { font-size:11px; color:var(--gold); font-weight:800; margin-top:2px; }

  .wheel-wrap {
    position:relative; width:240px; height:240px; margin:0 auto 10px;
  }
  .wheel-pointer {
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:6;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:20px solid var(--accent);
    filter:drop-shadow(0 3px 8px rgba(91,141,239,0.5));
    transition:border-top-color .25s;
  }
  .wheel-pointer.fail { border-top-color:var(--danger); filter:drop-shadow(0 3px 8px rgba(232,93,93,0.5)); }
  .wheel {
    width:240px; height:240px; border-radius:50%;
    position:relative; overflow:hidden;
    border:5px solid var(--border);
    transition:transform 5.5s cubic-bezier(.12,.62,.22,1);
    will-change:transform;
    background:var(--surface-2);
  }
  .wheel-segments { position:absolute; inset:0; border-radius:50%; }
  .wheel-center {
    position:absolute; inset:50% auto auto 50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%; background:var(--surface);
    border:4px solid var(--border); display:flex; align-items:center;
    justify-content:center; font-size:26px; z-index:5;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
  }
  .chance {
    font-size:30px; font-weight:800; color:var(--accent);
    text-align:center; margin:6px 0 18px; letter-spacing:-0.5px;
  }
  .chance small { font-size:12px; color:var(--text-dim); font-weight:600; display:block; margin-top:3px; }
  .chance.fail { color:var(--danger); }
  .btn-big {
    width:100%; background:var(--accent); color:#fff;
    border:none; border-radius:16px; padding:18px;
    font-size:16px; font-weight:800; cursor:pointer;
    transition:transform .1s, opacity .15s, background .2s;
    letter-spacing:0.3px;
    box-shadow:0 4px 18px rgba(91,141,239,0.3);
  }
  .btn-big:active { transform:scale(.98); background:var(--accent-2); }
  .btn-big:disabled { opacity:.35; box-shadow:none; }

  .crash-box {
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:var(--radius); padding:16px; overflow:hidden;
  }
  .crash-canvas-wrap {
    position:relative; height:240px; background:var(--surface-2);
    border-radius:14px; overflow:hidden; margin-bottom:14px;
  }
  #crashCanvas { width:100%; height:100%; display:block; }
  .crash-mult {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    font-size:46px; font-weight:800; color:var(--success);
    text-shadow:0 0 30px rgba(74,222,128,0.35); pointer-events:none;
    transition:color .2s; letter-spacing:-1px;
  }
  .crash-mult.crashed { color:var(--danger); text-shadow:0 0 30px rgba(232,93,93,0.35); }
  .crash-controls { display:flex; gap:12px; align-items:center; margin-bottom:14px; }
  .crash-input {
    flex:1; background:var(--surface-2); border:1.5px solid var(--border);
    border-radius:14px; padding:16px; color:var(--text);
    font-size:16px; font-weight:800; outline:none; text-align:center;
  }
  .crash-input:focus { border-color:var(--accent); }
  .btn-cashout {
    flex:1; background:var(--accent); color:#fff; border:none;
    border-radius:14px; padding:16px; font-size:16px; font-weight:800;
    cursor:pointer; transition:transform .1s, opacity .15s;
    box-shadow:0 4px 16px rgba(91,141,239,0.3);
  }
  .btn-cashout:active { transform:scale(.97); }
  .btn-cashout:disabled { opacity:.35; box-shadow:none; }
  .btn-cashout.cashout-mode { background:var(--gold); color:#0a0c10; box-shadow:0 4px 16px rgba(245,197,66,0.3); }

  /* Лента ставок в Crash */
  .crash-feed-title {
    font-size:11px; color:var(--text-dim); font-weight:800;
    text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;
  }
  .crash-feed {
    display:flex; flex-direction:column; gap:6px;
    max-height:160px; overflow-y:auto; scrollbar-width:none;
  }
  .crash-feed::-webkit-scrollbar { display:none; }
  .feed-row {
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700;
    animation:feedIn .3s ease;
  }
  @keyframes feedIn { from{opacity:0; transform:translateX(-10px);} to{opacity:1; transform:none;} }
  .feed-row .f-avatar {
    width:22px; height:22px; border-radius:50%;
    background:var(--surface-3); display:flex; align-items:center;
    justify-content:center; font-size:11px; flex-shrink:0;
  }
  .feed-row .f-name { flex:1; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .feed-row .f-bet { color:var(--text-dim); font-size:11px; }
  .feed-row .f-result { font-size:11px; font-weight:800; }
  .feed-row .f-result.win { color:var(--success); }
  .feed-row .f-result.lose { color:var(--danger); }

  .feed-empty { color:var(--text-dim); font-size:12px; text-align:center; padding:14px 0; }
  .ref-box { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
  .ref-box .ref-title { font-size:14px; font-weight:800; margin-bottom:6px; }
  .ref-box .ref-text { font-size:12px; color:var(--text-dim); line-height:1.5; margin-bottom:12px; }
  .nav {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(18,20,26,.96); backdrop-filter:blur(20px);
    border-top:1.5px solid var(--border);
    display:flex; justify-content:space-around;
    padding:12px 10px calc(12px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .nav-item {
    flex:1; text-align:center; cursor:pointer;
    color:var(--text-dim); font-size:11px; font-weight:700;
    padding:4px 0; transition:color .15s;
  }
  .nav-item .icon { font-size:22px; display:block; margin-bottom:3px; }
  .nav-item.active { color:var(--accent); }

  .toast {
    position:fixed; bottom:100px; left:50%;
    transform:translateX(-50%) translateY(24px);
    background:var(--surface-2); border:1.5px solid var(--accent);
    color:var(--text); padding:14px 24px; border-radius:14px;
    font-size:14px; font-weight:700; opacity:0; pointer-events:none;
    transition:all .3s; z-index:50; white-space:nowrap; max-width:90vw;
    box-shadow:var(--shadow);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error { border-color:var(--danger); }

  .loader {
    position:fixed; inset:0; background:rgba(18,20,26,.85);
    backdrop-filter:blur(8px); display:none; align-items:center;
    justify-content:center; z-index:60; flex-direction:column; gap:16px;
  }
  .loader.show { display:flex; }
  .spinner {
    width:48px; height:48px; border-radius:50%;
    border:4px solid var(--border); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loader-text { font-size:14px; color:var(--text-dim); font-weight:700; }

  .modal {
    position:fixed; inset:0; background:rgba(0,0,0,.75);
    display:none; align-items:center; justify-content:center;
    z-index:70; padding:20px;
  }
  .modal.show { display:flex; }
  .modal-card {
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:22px; padding:28px 24px; width:100%; max-width:350px;
    text-align:center; animation:pop .25s ease;
  }
  @keyframes pop { from{transform:scale(.9); opacity:0;} to{transform:scale(1); opacity:1;} }
  .modal-card .big-img { font-size:72px; margin-bottom:12px; }
  .modal-card h3 { font-size:19px; font-weight:800; margin-bottom:8px; }
  .modal-card p { font-size:14px; color:var(--text-dim); margin-bottom:22px; line-height:1.6; }
  .modal-actions { display:flex; gap:12px; }

  .case-open-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.88);
    backdrop-filter:blur(10px); display:none; flex-direction:column;
    align-items:center; justify-content:center; z-index:80; padding:20px;
  }
  .case-open-overlay.show { display:flex; }
  .roulette-strip-wrap {
    width:100%; max-width:380px; height:130px;
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:16px; overflow:hidden; position:relative;
    margin-bottom:28px; box-shadow:var(--shadow);
  }
  .roulette-strip {
    display:flex; height:100%; align-items:center; will-change:transform;
  }
  .roulette-item {
    flex:0 0 120px; height:100%; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    border-right:1px solid var(--border); font-size:14px;
    font-weight:700; color:var(--text-dim);
  }
  .roulette-item .gift-img { font-size:38px; margin-bottom:6px; }
  .roulette-item.winner { color:var(--accent); }
  .roulette-pointer {
    position:absolute; top:0; bottom:0; left:50%;
    width:2.5px; background:var(--accent); transform:translateX(-50%);
    box-shadow:0 0 16px var(--accent); z-index:2;
  }
  .case-open-result { text-align:center; opacity:0; transition:opacity .35s; }
  .case-open-result.show { opacity:1; }
  .case-open-result .big-img { font-size:72px; margin-bottom:10px; }
  .case-open-result h3 { font-size:20px; font-weight:800; margin-bottom:6px; }
  .case-open-result p { font-size:14px; color:var(--text-dim); margin-bottom:22px; }

:root{--bg:#10131c;--surface:#1b2030;--surface-2:#252b40;--surface-3:#2f3652;--accent:#3d7bff;--accent-2:#2c63d9;--gold:#ffc42e;--danger:#ff4d5e;--success:#2fd46b;--border:#0a0c12;--ink:#0a0c12}
body{font-family:ui-rounded,'SF Pro Rounded','Nunito','Baloo 2',system-ui,sans-serif;font-weight:700}
svg.ic{width:1em;height:1em;display:block;margin:0 auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.case-card,.inv-item,.upgrade-box,.crash-box,.ref-box,.balance,.online-badge,.picker-item,.upgrade-slot{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.picker-item,.upgrade-slot{box-shadow:0 3px 0 var(--ink)}
.case-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn,.btn-big,.btn-cashout{border:3px solid var(--ink)!important;box-shadow:0 4px 0 var(--ink)!important}
.btn:active,.btn-big:active,.btn-cashout:active{transform:translateY(3px)!important;box-shadow:0 1px 0 var(--ink)!important}
.btn-sell{background:var(--surface-3)}.logo-icon{border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.page{padding:0 14px}.header{padding:14px 14px 8px}.cases-grid,.inv-grid{gap:12px}
.crash-box{padding:12px}
.crash-canvas-wrap{height:clamp(240px,76vw,340px);background:#0e1330;border:3px solid var(--ink)}
.crash-mult{font-size:clamp(34px,12vw,48px);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.crash-mult.crashed{text-shadow:0 4px 0 var(--ink)}
.crash-controls{gap:10px}.crash-input,.btn-cashout{min-width:0;width:100%;padding:14px 6px}
.wheel-wrap,.wheel{width:min(240px,66vw);height:min(240px,66vw)}
.feed-row{min-width:0}.nav-item .icon svg{width:26px;height:26px}

:root{--ink:#16194a;--border:#16194a;--bg:#2a46d8;--surface:#3957ee;--surface-2:#2b45c6;--surface-3:#5b78ff;--text:#fff;--text-dim:#cdd5ff;--accent:#35d6ff;--accent-2:#14b4e6;--gold:#ffd23f;--success:#3be07f;--danger:#ff4d6d}
body{background:linear-gradient(165deg,#2a46d8 0%,#6a35e0 60%,#b43fd9 100%) fixed}
.header{background:linear-gradient(180deg,#2a46d8 72%,transparent)}
.nav{background:var(--surface-2);border-top:3px solid var(--ink)}
.btn-withdraw,.btn-big,.btn-cashout{color:var(--ink)}.btn-sell{color:#fff}
.crash-input{background:var(--surface-2);color:#fff}.crash-canvas-wrap{background:#3a35d8}
.picker-item.selected{border-color:var(--gold)}
.roulette-item.winner{color:inherit}
.toast{white-space:normal;width:max-content;max-width:calc(100vw - 28px);text-align:center;line-height:1.3;box-sizing:border-box}
.case-card .name{text-shadow:0 2px 0 rgba(22,25,74,.45)}
.case-card .price{color:#fff;background:rgba(22,25,74,.4);display:inline-block;padding:2px 10px;border-radius:10px}
.case-card .nft-hint{color:#fff}
.tier-bronze{background:linear-gradient(160deg,#ff9a3c,#e0561f)}.tier-silver{background:linear-gradient(160deg,#6fc3ff,#3b7bff)}
.tier-gold{background:linear-gradient(160deg,#ffd84d,#ff9f1c)}.tier-legend{background:linear-gradient(160deg,#c05cff,#6b2fe0)}
.tier-free{background:linear-gradient(160deg,#3be07f,#12a85a)}.tier-lock{background:linear-gradient(160deg,#8a93c9,#5b63a0)}
.tier-free .badge{background:var(--gold)}
.crash-mult.wait{font-size:clamp(18px,6vw,26px);-webkit-text-stroke:4px var(--ink);color:#fff}
.crash-history{display:flex;gap:6px;margin-bottom:12px;min-height:30px}
.h-chip{flex:1;min-width:0;text-align:center;padding:6px 0;border-radius:10px;border:3px solid var(--ink);font-size:12px;font-weight:900;color:#fff;box-shadow:0 2px 0 var(--ink)}
.h-chip.low{background:var(--danger)}.h-chip.mid{background:#2f6bff}.h-chip.high{background:var(--gold);color:var(--ink)}

/* v5: мягче и менее мультяшно */
svg.ic{stroke:#1d2155;stroke-width:2.6px;filter:drop-shadow(0 2px 3px rgba(22,25,74,.25))}
.case-card,.inv-item,.upgrade-box,.crash-box,.ref-box,.balance,.online-badge{border:2px solid var(--ink);box-shadow:0 3px 8px rgba(22,25,74,.28),inset 0 1px 0 rgba(255,255,255,.22)}
.picker-item,.upgrade-slot{border-width:2px;box-shadow:none}
.case-card:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(22,25,74,.3)}
.btn,.btn-big,.btn-cashout{border:2px solid var(--ink)!important;box-shadow:0 2px 0 rgba(22,25,74,.45),inset 0 1px 0 rgba(255,255,255,.3)!important}
.btn:active,.btn-big:active,.btn-cashout:active{transform:translateY(2px)!important;box-shadow:none!important}
.logo-icon{border:2px solid var(--ink);box-shadow:0 2px 4px rgba(22,25,74,.3)}
.case-card .name{text-shadow:0 1px 2px rgba(22,25,74,.4)}
.crash-canvas-wrap{border:2px solid var(--ink)}
.crash-mult{-webkit-text-stroke:3px var(--ink);text-shadow:0 2px 4px rgba(22,25,74,.35)}.crash-mult.crashed{text-shadow:0 2px 4px rgba(22,25,74,.35)}
.crash-mult.wait{-webkit-text-stroke:3px var(--ink)}
.h-chip{border-width:2px;box-shadow:none}
.tier-bronze{background:linear-gradient(160deg,#f59a45,#d4622a)}.tier-silver{background:linear-gradient(160deg,#6db6f5,#3f7ae8)}
.tier-gold{background:linear-gradient(160deg,#f6cf56,#ec9b22)}.tier-legend{background:linear-gradient(160deg,#b865f2,#6f38d8)}
.tier-free{background:linear-gradient(160deg,#47d886,#1fa862)}

  /* ShiroGifts visual refresh: richer case palettes, motion and sound control */
  .sound-toggle {
    width:36px;height:36px;flex:0 0 36px;border:2px solid var(--ink);
    border-radius:12px;background:linear-gradient(145deg,#fff2b8,#ffc857);
    color:#38224f;font-size:17px;display:grid;place-items:center;
    box-shadow:0 3px 0 rgba(22,25,74,.45);cursor:pointer;
    transition:transform .16s,filter .16s;
  }
  .sound-toggle:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(22,25,74,.45)}
  .sound-toggle.muted{background:var(--surface-2);filter:grayscale(.8);color:var(--text-dim)}
  .case-card {
    isolation:isolate;
    background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.025)),var(--surface);
    box-shadow:0 7px 18px rgba(14,12,45,.22),inset 0 1px 0 rgba(255,255,255,.25);
    transform:translateZ(0);
  }
  .case-card::before{
    content:"";position:absolute;inset:-70% -35%;z-index:-1;pointer-events:none;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.18) 49%,transparent 60%);
    transform:translateX(-75%) rotate(8deg);transition:transform .7s ease;
  }
  .case-card:active::before,.case-card:focus-visible::before{transform:translateX(75%) rotate(8deg)}
  .case-card .gift-img{animation:caseFloat 3.2s ease-in-out infinite;will-change:transform}
  .case-card:nth-child(2) .gift-img{animation-delay:-.7s}
  .case-card:nth-child(3) .gift-img{animation-delay:-1.4s}
  .case-card:nth-child(4) .gift-img{animation-delay:-2.1s}
  @keyframes caseFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
  .tier-bronze{background:radial-gradient(circle at 15% 0%,rgba(255,221,153,.65),transparent 44%),linear-gradient(145deg,#f59a45,#a94322 88%)!important}
  .tier-silver{background:radial-gradient(circle at 85% 5%,rgba(255,255,255,.72),transparent 42%),linear-gradient(145deg,#b6d9ed,#537cae 88%)!important}
  .tier-gold{background:radial-gradient(circle at 15% 0%,rgba(255,255,220,.78),transparent 43%),linear-gradient(145deg,#ffe17a,#d77b17 90%)!important}
  .tier-legend{background:radial-gradient(circle at 80% 0%,rgba(255,221,255,.68),transparent 40%),linear-gradient(145deg,#e07cff,#6432bd 90%)!important}
  .tier-free{background:radial-gradient(circle at 15% 0%,rgba(220,255,220,.7),transparent 42%),linear-gradient(145deg,#6be6a0,#168a68 90%)!important}
  .tier-lock{background:radial-gradient(circle at 85% 0%,rgba(225,225,255,.28),transparent 42%),linear-gradient(145deg,#777fa8,#454c7d 90%)!important}
  .case-card .name,.case-card .price,.case-card .nft-hint{color:#fff;text-shadow:0 2px 5px rgba(25,16,48,.35)}

  .case-card .rarity-bar{height:4px;background:linear-gradient(90deg,rgba(255,255,255,.35),#fff,rgba(255,255,255,.35));opacity:.8}
  .case-open-overlay{
    background:radial-gradient(ellipse at 50% 42%,rgba(116,58,176,.32),transparent 58%),rgba(9,8,24,.94);
  }
  .roulette-strip-wrap{border-color:rgba(255,255,255,.22);box-shadow:0 16px 50px rgba(0,0,0,.42),0 0 32px rgba(193,111,255,.16)}
  .roulette-pointer{background:#ffe07a;box-shadow:0 0 18px #ffe07a}
  .roulette-item.winner{color:#ffe07a;text-shadow:0 0 14px rgba(255,224,122,.6)}
  .case-open-result.show{animation:resultPop .42s cubic-bezier(.2,.9,.25,1.25)}

  .case-open-result .big-img{filter:drop-shadow(0 8px 24px rgba(255,220,120,.28));animation:rewardFloat 2s ease-in-out infinite}
  @keyframes rewardFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.04)}}
  .page.active .section-title{animation:sectionIn .35s ease both}
  @keyframes sectionIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
  }


  .topup-button{width:32px;height:32px;border:0;border-radius:50%;background:linear-gradient(145deg,#ffe58b,#f3ad32);color:#37234f;font-size:24px;font-weight:800;line-height:1;display:grid;place-items:center;box-shadow:0 3px 10px rgba(243,173,50,.28);cursor:pointer;transition:transform .16s,filter .16s}

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.setHeaderColor) tg.setHeaderColor('#12141a');
}

let audioContext = null;
let soundEnabled = (() => { try { return localStorage.getItem('shiro-sound') !== 'off'; } catch(e) { return true; } })();

function updateSoundButton() {
  const button = document.getElementById('soundToggle');
  if (!button) return;
  button.textContent = soundEnabled ? '🔊' : '🔇';
  button.classList.toggle('muted', !soundEnabled);
  button.setAttribute('aria-label', soundEnabled ? 'Выключить звук' : 'Включить звук');
}
function toggleSound() {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('shiro-sound', soundEnabled ? 'on' : 'off'); } catch(e) {}
  updateSoundButton();
  if (soundEnabled) playUiSound('confirm');
}
function playUiSound(kind = 'tap') {
  if (!soundEnabled) return;
  try {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return;
    if (!audioContext) audioContext = new AudioCtor();
    if (audioContext.state === 'suspended') audioContext.resume();
    const ctx = audioContext;
    const now = ctx.currentTime;
    const presets = {
      tap: [620, 0.055, 'sine', 0.045],
      tick: [880, 0.035, 'square', 0.025],
      confirm: [740, 0.11, 'sine', 0.055],
      success: [880, 0.18, 'triangle', 0.075],
      error: [180, 0.16, 'triangle', 0.06],
      whoosh: [360, 0.48, 'sawtooth', 0.035]
    };
    const [frequency, duration, wave, volume] = presets[kind] || presets.tap;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    osc.type = wave;
    osc.frequency.setValueAtTime(kind === 'whoosh' ? 520 : frequency, now);
    if (kind === 'whoosh') osc.frequency.exponentialRampToValueAtTime(95, now + duration);
    if (kind === 'success') osc.frequency.setValueAtTime(988, now + 0.08);
    if (kind === 'error') osc.frequency.exponentialRampToValueAtTime(105, now + duration);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(kind === 'whoosh' ? 1800 : 4200, now);
    filter.frequency.exponentialRampToValueAtTime(kind === 'whoosh' ? 240 : 900, now + duration);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + duration + 0.02);
    if (kind === 'success') {
      const second = ctx.createOscillator();
      const secondGain = ctx.createGain();
      second.type = 'sine';
      second.frequency.setValueAtTime(1318, now + 0.08);
      secondGain.gain.setValueAtTime(0.0001, now);
      secondGain.gain.exponentialRampToValueAtTime(0.035, now + 0.09);
      secondGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.27);
      second.connect(secondGain); secondGain.connect(ctx.destination);
      second.start(now + 0.08); second.stop(now + 0.3);
    }
  } catch(e) {}
}
function haptic(type) {
  playUiSound(type === 'success' ? 'success' : type === 'error' ? 'error' : 'tap');
  if (!tg?.HapticFeedback) return;
  try {
    if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred('light');
  } catch(e) {}
}
updateSoundButton();

star:S('<path d="M32 6l7 17 18 2-14 12 5 18-16-10-16 10 5-18L7 25l18-2z" fill="#ffc42e"/>')

  const targetOffset = winnerIndex * itemWidth - wrapWidth / 2 + itemWidth / 2;
  const jitter = (Math.random() - 0.5) * 50;
  const finalOffset = targetOffset + jitter;

  const duration = 4500;
  const start = performance.now();
  let lastTickIndex = -1;
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    const eased = easeOutQuad(t);
    const current = finalOffset * eased;
    const itemIndex = Math.floor(current / itemWidth);
    if (itemIndex !== lastTickIndex && itemIndex % 4 === 0) {
      playUiSound('tick');
      lastTickIndex = itemIndex;
    }
    strip.style.transform = `translateX(-${current}px)`;
    if (t < 1) {
      requestAnimationFrame(tick);

function calcChance(fromKey, toKey) {
  const from = GIFTS[fromKey];
  const to = GIFTS[toKey];
  if (!from || !to || to.price <= from.price) return 0;
  const raw = from.price / to.price;
  const fair = Math.floor(raw * 0.9 * 100) / 100; // округляем вниз до целого %, показанный шанс = реальный
  return Math.max(0.05, Math.min(0.9, fair));
}

/* ===== CRASH ===== */
let crashState = 'idle';
let crashMult = 1.0;
let crashCrashAt = 1.0;
let crashRaf = null;
let crashStart = 0;
let crashPoints = [];
let crashBetAmount = 0;
let crashParticles = [];
let crashCashoutMult = null;


function initCrashCanvas() {
  const c = document.getElementById('crashCanvas');
  const wrap = c.parentElement;
  c.width = wrap.clientWidth * (window.devicePixelRatio || 1);
  c.height = wrap.clientHeight * (window.devicePixelRatio || 1);
  c.style.width = wrap.clientWidth + 'px';
  c.style.height = wrap.clientHeight + 'px';
  const ctx = c.getContext('2d');
  ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
  drawCrash();
}

function crashHeading(t) { return Math.atan2(-15 * Math.sqrt(Math.max(t, 0.01)), 30 + 2.4 * t); }

function drawRocket(ctx, u, flame) {
  ctx.lineWidth = 2.2; ctx.strokeStyle = '#1d2155'; ctx.lineJoin = 'round';
  const fs = (pts, col) => { ctx.fillStyle = col; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0]*u, p[1]*u) : ctx.moveTo(p[0]*u, p[1]*u)); ctx.closePath(); ctx.fill(); ctx.stroke(); };
  if (flame) { const f = 1.1 + Math.random() * 0.7; fs([[-.38,1],[0,1+f*1.3],[.38,1]], '#ffc42e'); fs([[-.2,1],[0,1+f*.7],[.2,1]], '#ff6a2b'); }
  fs([[-.5,.2],[-1.05,1.15],[-.45,.95]], '#ff4d5e'); fs([[.5,.2],[1.05,1.15],[.45,.95]], '#ff4d5e');
  ctx.fillStyle = '#f4f7ff'; ctx.beginPath(); ctx.moveTo(0, -1.7*u);
  ctx.bezierCurveTo(.95*u, -.8*u, .75*u, .6*u, .5*u, 1.05*u); ctx.lineTo(-.5*u, 1.05*u);
  ctx.bezierCurveTo(-.75*u, .6*u, -.95*u, -.8*u, 0, -1.7*u); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff4d5e'; ctx.beginPath(); ctx.moveTo(0, -1.7*u); ctx.bezierCurveTo(.4*u, -1.3*u, .5*u, -1.0*u, .52*u, -.8*u);
  ctx.lineTo(-.52*u, -.8*u); ctx.bezierCurveTo(-.5*u, -1.0*u, -.4*u, -1.3*u, 0, -1.7*u); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#3d7bff'; ctx.beginPath(); ctx.arc(0, -.1*u, .34*u, 0, 7); ctx.fill(); ctx.stroke();
}

function drawCrash() {
  const c = document.getElementById('crashCanvas');
  const ctx = c.getContext('2d');
  const W = c.parentElement.clientWidth, H = c.parentElement.clientHeight;
  if (!W || !H) return;
  const k = Math.min(W, H) / 250, cx = W / 2, cy = H * 0.52;
  const t = Math.max(0, timeAt(crashMult));
  const crashed = crashState === 'crashed';
  const P = s => ({ x: (30 * s + 1.2 * s * s) * k, y: -10 * Math.pow(s, 1.5) * k });   // траектория в «мире»
  const cur = P(t);
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#3a35d8'); bg.addColorStop(1, '#2fb7ff');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // сетка и звёзды движутся навстречу камере (параллакс)
  const grid = (sp, f, a, r) => { ctx.fillStyle = `rgba(255,255,255,${a})`;
    const ox = ((-cur.x * f) % sp + sp) % sp, oy = ((-cur.y * f) % sp + sp) % sp;
    for (let x = ox - sp; x < W + sp; x += sp) for (let y = oy - sp; y < H + sp; y += sp) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); } };
  grid(46 * k, 0.35, 0.28, 1.4 * k); grid(30 * k, 1, 0.12, 1.1 * k);
  // след: плавная кривая, ракета всегда в центре
  const pts = []; const s0 = Math.max(0, t - 9), N = 70;
  for (let i = 0; i <= N; i++) { const p = P(s0 + (t - s0) * i / N); pts.push({ x: cx + p.x - cur.x, y: cy + p.y - cur.y }); }
  if (t > 0.02) {
    ctx.beginPath(); ctx.moveTo(pts[0].x, H + 20); pts.forEach(p => ctx.lineTo(p.x, p.y)); ctx.lineTo(cx, H + 20); ctx.closePath();
    const fg = ctx.createLinearGradient(0, cy, 0, H); fg.addColorStop(0, 'rgba(255,196,46,.38)'); fg.addColorStop(1, 'rgba(255,196,46,0)');
    ctx.fillStyle = fg; ctx.fill();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    [[9 * k, 'rgba(22,25,74,.55)'], [6 * k, '#ffc42e']].forEach(([w, col]) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke(); });
  }
  // частицы (выхлоп/взрыв) в экранных координатах
  crashParticles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
  if (!crashed) {
    const th = crashHeading(t), bob = crashState === 'flying' ? Math.sin(performance.now() / 160) * 2 * k : 0;
    ctx.save(); ctx.translate(cx, cy + bob); ctx.rotate(th + Math.PI / 2); drawRocket(ctx, 15 * k, crashState === 'flying'); ctx.restore();
  }
}

function spawnParticles(x, y, crashed) {
  const colors = crashed ? ['#e85d5d','#ff8a8a','#f5c542'] : ['#4ade80','#d4ff7a','#ffffff'];
  for (let i = 0; i < 20; i++) {
    crashParticles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      r: Math.random() * 3.5 + 1,
      life: 1,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function updateParticles() {
  crashParticles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life -= 0.03; });
  crashParticles = crashParticles.filter(p => p.life > 0);
}

/* ===== РАУНДЫ CRASH: один общий раунд для всех игроков ===== */
// Раунд ведёт СЕРВЕР: он решает, когда старт и где краш. Клиент только показывает.
// Точка краша клиентам не отправляется до самого краша: множитель считается по времени сервера.
// Множитель растёт экспоненциально: медленный старт и постепенное ускорение (2x ≈ 4.6 с, 5x ≈ 11 с, 10x ≈ 15 с)
const GROWTH_K = 0.15, multAt = t => Math.exp(GROWTH_K * t), timeAt = m => Math.log(m) / GROWTH_K;
let round = { phase: 'idle', id: 0, startedAt: 0 };
let myBet = null;          // { amount, cashed: null | mult }
let flightHistory = [];    // последние 5 краш-множителей, новые слева
let serverOffset = 0;      // serverTime - Date.now()
const serverNow = () => Date.now() + serverOffset;
const PHASE_STATE = { betting: 'idle', flying: 'flying', crashed: 'crashed' };

function onRound(e) {      // событие от сервера: {phase:'betting'|'flying'|'crashed', id, startsAt|startedAt|crashMult}
  round = e; crashState = PHASE_STATE[e.phase];
  if (e.phase === 'betting') { myBet = null; crashMult = 1; crashParticles = []; feedClear(); }
  if (e.phase === 'flying') crashMult = 1;
  if (e.phase === 'crashed') {
    crashMult = e.crashMult; haptic('error');
    flightHistory = [e.crashMult, ...flightHistory].slice(0, 5); renderHistory();
    const cw = document.getElementById('crashCanvas').parentElement;
    spawnParticles(cw.clientWidth / 2, cw.clientHeight * 0.52, true); spawnParticles(cw.clientWidth / 2, cw.clientHeight * 0.52, true);
    if (myBet && myBet.cashed === null) { setFeedResult(feedYouRowId, crashMult, 0, true); toast('Краш на ' + crashMult.toFixed(2) + 'x', true); }
    else if (myBet) toast('Краш на ' + crashMult.toFixed(2) + 'x (вы вывели на ' + myBet.cashed.toFixed(2) + 'x)', true);
  }
  renderCrashUI();
}

function renderHistory() {
  document.getElementById('crashHistory').innerHTML = flightHistory.length
    ? flightHistory.map(m => `<span class="h-chip ${m < 2 ? 'low' : m < 5 ? 'mid' : 'high'}">${m.toFixed(2)}x</span>`).join('')
    : '<span class="feed-empty" style="padding:0">Пока нет полётов</span>';
}

function renderCrashUI() {
  const btn = document.getElementById('crashBtn'), inp = document.getElementById('crashBet');
  document.getElementById('crashMult').classList.toggle('crashed', round.phase === 'crashed');
  let txt = 'Раунд окончен', dis = true, cash = false;
  if (round.phase === 'betting') { txt = myBet ? 'Ставка принята' : 'Поставить'; dis = !!myBet; }
  else if (round.phase === 'flying') {
    if (myBet && myBet.cashed === null) { txt = 'Забрать'; dis = false; cash = true; }
    else txt = myBet ? 'Вывели' : 'Ждём краш';
  }
  btn.textContent = txt; btn.disabled = dis; btn.classList.toggle('cashout-mode', cash);
  inp.disabled = !(round.phase === 'betting' && !myBet);
}

function crashAction() {
  toast('Crash временно отключён до подключения серверной игровой логики.', true);
}

function crashFrame() {
  const multEl = document.getElementById('crashMult');
  if (round.phase === 'flying') {
    crashMult = Math.max(1, multAt((serverNow() - round.startedAt) / 1000));
    multEl.classList.remove('wait'); multEl.textContent = crashMult.toFixed(2) + 'x';
    const cw = document.getElementById('crashCanvas').parentElement, k = Math.min(cw.clientWidth, cw.clientHeight) / 250;
    const th = crashHeading(timeAt(crashMult)), tx = cw.clientWidth / 2 - Math.cos(th) * 24 * k, ty = cw.clientHeight * 0.52 - Math.sin(th) * 24 * k;
    for (let i = 0; i < 2; i++) crashParticles.push({ x: tx, y: ty, vx: -Math.cos(th) * 2.2 + (Math.random() - .5), vy: -Math.sin(th) * 2.2 + (Math.random() - .5) - 0.1, r: Math.random() * 3 + 2, life: 0.8, color: Math.random() < .5 ? '#ffc42e' : '#ff6a2b' });
  } else if (round.phase === 'betting') {
    multEl.classList.add('wait'); multEl.textContent = 'Ожидание ставок';
  } else if (round.phase === 'idle') {
    multEl.classList.add('wait'); multEl.textContent = 'Сервер не подключён';
  } else { multEl.classList.remove('wait'); multEl.textContent = crashMult.toFixed(2) + 'x'; }
  updateParticles();
  if (document.getElementById('page-crash').classList.contains('active')) drawCrash();
  requestAnimationFrame(crashFrame);
}

/* Live rounds are accepted only from a future authenticated server stream. */
/* ===== ЛЕНТА СТАВОК CRASH (только реальные игроки) ===== */
let feedYouRowId = null;
let feedRowCounter = 0;
const feedRows = {};

function feedCheckEmpty() {
  const feed = document.getElementById('crashFeed');
  const empty = feed.querySelector('.feed-empty');
  const hasRows = !!feed.querySelector('.feed-row');
  if (hasRows && empty) empty.remove();
  if (!hasRows && !empty) {
    const d = document.createElement('div');
    d.className = 'feed-empty';
    d.textContent = 'Игровой сервер пока не подключён.';
    feed.appendChild(d);
  }
}

// Имена — через textContent (никакого innerHTML с данными игроков: защита от XSS)
function addFeedRow({ betId, name, avatar, bet, isYou }) {
  const feed = document.getElementById('crashFeed');
  const row = document.createElement('div');
  row.className = 'feed-row';
  const mk = (cls, text) => { const e = document.createElement('span'); e.className = cls; e.textContent = text; return e; };
  row.append(mk('f-avatar', isYou ? '👤' : (avatar || '👤')),
             mk('f-name', name || 'Аноним'),
             mk('f-bet', '★' + fmt(bet)),
             mk('f-result', 'в игре...'));
  row.lastChild.style.color = 'var(--text-dim)';
  feedRows[betId] = row;
  feed.insertBefore(row, feed.firstChild);
  while (feed.querySelectorAll('.feed-row').length > 12) {
    const last = feed.querySelector('.feed-row:last-of-type');
    if (!last) break;
    last.remove();
  }
  feedCheckEmpty();
}

function setFeedResult(betId, mult, win, crashed) {
  const row = feedRows[betId];
  const res = row && row.querySelector('.f-result');
  if (!res) return;
  res.removeAttribute('style');
  if (crashed) { res.className = 'f-result lose'; res.textContent = '💥 ' + mult.toFixed(2) + 'x'; }
  else { res.className = 'f-result win'; res.textContent = `+${fmt(win)} ★ (${mult.toFixed(2)}x)`; }
}

function updateFeedYou(mult, win, crashed) {
  if (!feedYouRowId) return;
  if (crashed) setFeedResult(feedYouRowId, crashMult, 0, true);
  else setFeedResult(feedYouRowId, mult, win, false);
}

function feedClear() { Object.keys(feedRows).forEach(k => delete feedRows[k]); document.getElementById('crashFeed').innerHTML = ''; feedYouRowId = null; feedCheckEmpty(); }
function startCrashFeed() { feedCheckEmpty(); }

// ===== Публичный интерфейс для реальных данных (WebSocket/SSE от сервера) =====
// ws.onmessage → ShiroLive.onBet / onResult / setOnline
window.ShiroLive = {

  onBet(e) { addFeedRow({ betId: e.betId, name: e.name, avatar: e.avatar, bet: e.bet, isYou: false }); },
  // { betId, mult, win, crashed } — игрок вывел (crashed=false) или взорвался (crashed=true)
  onResult(e) { setFeedResult(e.betId, e.mult, e.win || 0, !!e.crashed); },

  setHistory(a) { flightHistory = a.slice(0, 5); renderHistory(); },

async function loadAccount() {
  if (!tg?.initData) return;
  try {
    const response = await fetch('/api/me', {
      headers: { 'x-telegram-init-data': tg.initData }
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'account_unavailable');
    balance = Number(data.balance) || 0;
    inventory = (data.inventory || []).map(item => ({
      uid: String(item.id), gift: item.gift_key, status: item.status
    }));
    accountReady = true;
    updateBalanceUI();
    renderInventory();
    renderUpgrade();
    return true;
  } catch (error) {
    accountReady = false;
    toast('Не удалось загрузить аккаунт. Попробуйте открыть приложение позже.', true);
    return false;
  }
}

async function topUp() {
  if (!tg?.initData) {
    toast('Пополнение доступно при запуске Mini App через Telegram.', true);
    return;
  }
  if (!accountReady && !(await loadAccount())) {
    toast('Сначала нужно загрузить аккаунт. Попробуйте ещё раз.', true);
    return;
  }
  const startingBalance = balance;
  const raw = window.prompt('Сколько Telegram Stars добавить? Минимум 5.');
  if (raw === null) return;
  const amount = Number(raw.trim());
  if (!Number.isSafeInteger(amount) || amount < 5 || amount > 10000) {
    toast('Введите целое число от 5 до 10 000 Stars.', true);
    return;
  }
  try {
    const response = await fetch('/api/payments/invoice', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-telegram-init-data': tg.initData },
      body: JSON.stringify({ amount })
    });
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || 'invoice_unavailable');
    tg.openInvoice(data.invoice_url, async status => {
      if (status === 'paid') {
        let credited = false;
        for (let attempt = 0; attempt < 10; attempt++) {
          await new Promise(resolve => setTimeout(resolve, 900));
          if (await loadAccount() && balance >= startingBalance + amount) {
            credited = true;
            break;
          }
        }
        toast(credited
          ? 'Платёж подтверждён, баланс пополнен.'
          : 'Telegram подтвердил платёж. Зачисление обрабатывается и появится после синхронизации.');
      } else if (status === 'failed') {
        toast('Платёж не прошёл. Баланс не изменён.', true);
      } else if (status === 'cancelled') {
        toast('Пополнение отменено.');
      }
    });
  } catch (error) {
    toast('Не удалось создать счёт. Проверьте настройки Telegram-бота.', true);
  }
}

loadAccount();
